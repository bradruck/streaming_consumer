apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apprise-consumer-egress-policy
  namespace: analyplat
spec:
  podSelector:
    matchLabels:
      networking/allow-internet-egress: "true"
  policyTypes:
    - Egress
    - Ingress
  egress:
    - to:
        - ipBlock:
            cidr: 10.196.130.4/32
    - ports:
        - port: 443
          protocol: TCP
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oracledatacloud.com/name: ingress-default