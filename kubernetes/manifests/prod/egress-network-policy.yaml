apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apprise-consumer-egress-policy
  namespace: analyplat
spec:
  podSelector:
    matchLabels:
      networking/allow-internet-egress: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.196.130.4/32
      ports:
        - protocol: TCP
          port: 443